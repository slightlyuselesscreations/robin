[project]
name = "robin"
dynamic = ["version"]
description = "Self-hosted tracker for upcoming games, movies, shows, books and comics"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
dependencies = [
    "apprise>=2.0.1",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    "fastapi==0.157.0",
    "httpx==0.28.1",
    "segno==1.6.6",
    "uvicorn==0.54.0",
    "webauthn==3.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "robin/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["robin"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]
